view-frame:after{content:"";pointer-events:none;position:absolute;inset:60% 0 0;background:linear-gradient(transparent,#0006)}.preview-meta{display:flex;justify-content:space-between;gap:15px;margin-top:18px;color:#aaa;font-size:12px;text-transform:uppercase;letter-spacing:.1em}.preview-title{font-size:clamp(21px,2vw,30px);letter-spacing:-.045em;line-height:1.15;margin:12px 0 0}.empty{padding:55px 0;color:#aaa}.mobile-image{display:none}

</style><link rel="stylesheet" href="shared.css"></head><body data-page="stories"><header class="site-header" id="site-header"></header><main><div class="heading"><h1>Stories</h1><p>Conversations and perspectives from artists shaping what comes next.</p></div><div class="toolbar"><div class="filters" id="filters" aria-label="Filter stories"></div><span class="count" id="count"></span></div><div class="content"><div class="story-list" id="storyList"></div><aside class="preview" aria-label="Story preview"><div class="preview-frame"><img id="previewA" alt=""><img id="previewB" alt=""></div><div class="preview-meta"><span id="previewCategory"></span><span id="previewDate"></span></div><div class="preview-title" id="previewTitle"></div></aside></div></main><footer class="site-footer" id="site-footer"></footer><script src="shared.js"></script>
<script>
const categories=['All','Art','Design','Photography','Film','Tech','Music','Craft','Essay','Event','Interview'];
const list=document.getElementById('storyList'),filters=document.getElementById('filters'),search=document.getElementById('search'),imgs=[document.getElementById('previewA'),document.getElementById('previewB')];
let stories=[],active=-1,category='All',current=null;search.value=new URLSearchParams(location.search).get('q')||'';
function preview(s){if(s===current)return;current=s;let next=active===0?1:0;const img=imgs[next];img.alt='Preview for '+s.title;img.onload=()=>{img.classList.add('visible');if(active>=0)imgs[active].classList.remove('visible');active=next};img.onerror=()=>{img.classList.remove('visible');if(active>=0)imgs[active].classList.remove('visible')};if(s.image)img.src=s.image;else img.removeAttribute('src');document.getElementById('previewCategory').textContent=(s.tags||[]).join(' · ');document.getElementById('previewDate').textContent=s.date||'';document.getElementById('previewTitle').textContent=s.title}
function render(){list.replaceChildren();current=null;const q=search.value.toLowerCase().trim();const shown=stories.filter(s=>(category==='All'||(s.tags||[]).includes(category))&&[s.title,s.category,s.date,s.excerpt,...(s.tags||[])].join(' ').toLowerCase().includes(q));document.getElementById('count').textContent=shown.length+' '+(shown.length===1?'Story':'Stories');if(!shown.length){list.innerHTML='<div class="empty">No stories found.</div>';return}shown.forEach((s,i)=>{const a=document.createElement('a');a.className='story';a.href='story.html?slug='+encodeURIComponent(s.slug);a.innerHTML='<span class="number">'+String(i+1).padStart(2,'0')+'</span><div class="story-main"><h2></h2><div class="meta"></div></div><span class="arrow" aria-hidden="true">↗</span>';a.querySelector('h2').textContent=s.title;a.querySelector('.meta').textContent=(s.tags||[]).join(' · ')+' · '+s.date+' · '+(s.read||'');a.addEventListener('mouseenter',()=>preview(s));a.addEventListener('focus',()=>preview(s));if(i===0)preview(s);list.append(a)})}
categories.forEach(c=>{let b=document.createElement('button');b.type='button';b.textContent=c;b.setAttribute('aria-pressed',String(c===category));b.addEventListener('click',()=>{category=c;filters.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});filters.append(b)});search.addEventListener('input',render);
fetch('stories.json').then(r=>{if(!r.ok)throw Error('Cannot load stories.json');return r.json()}).then(data=>{stories=data;render()}).catch(()=>{list.innerHTML='<div class="empty">Could not load stories.json. Preview through a local server or GitHub Pages.</div>'});
</script></body></html>
