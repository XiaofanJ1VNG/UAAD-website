<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story | Underground Art And Design</title><meta name="description" content="Stories from Underground Art And Design."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#f6f6f3;--muted:#999}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#000;color:var(--ink);font-family:"Wix Madefor Display",Arial,sans-serif}a{color:inherit;text-decoration:none}a:focus-visible,input:focus-visible{outline:2px solid #d2ff39;outline-offset:3px}::selection{background:#d2ff39;color:#000}
main{padding:160px 4vw 140px}.back{display:inline-block;color:#aaa;font-size:13px;margin:0 0 65px}.back:hover{color:#fff}.article{max-width:1080px;margin:auto}.article-eyebrow{display:flex;gap:12px;flex-wrap:wrap;color:#aaa;font-size:12px;text-transform:uppercase;letter-spacing:.09em;margin-bottom:26px}.article-eyebrow span{padding:7px 12px;border:1px solid #555;border-radius:999px}.article h1{font-size:clamp(54px,7.5vw,120px);line-height:.96;letter-spacing:-.075em;font-weight:500;margin:0 0 38px}.article-meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:#999;font-size:13px;margin-bottom:62px}.article-cover{width:100%;max-height:720px;object-fit:cover;background:#141414;display:block}.article-cover[hidden]{display:none}.article-intro{max-width:810px;font-size:clamp(22px,2.5vw,36px);line-height:1.32;letter-spacing:-.035em;margin:70px auto;color:#eee}.article-body{max-width:810px;margin:0 auto}.article-body h2{font-size:clamp(30px,3vw,48px);line-height:1.1;letter-spacing:-.055em;margin:70px 0 24px;font-weight:500}.article-body p{font-size:clamp(17px,1.6vw,22px);line-height:1.65;margin:0 0 28px;color:#d0d0d0}.article-body figure{margin:65px -9vw}.article-body figure img{width:100%;display:block;max-height:780px;object-fit:contain;background:#111}.article-body figcaption{color:#999;font-size:12px;margin-top:12px}.article-body blockquote{font-size:clamp(24px,3vw,42px);line-height:1.28;letter-spacing:-.04em;border-left:2px solid #888;padding-left:25px;margin:60px 0}.original{max-width:810px;margin:90px auto 0;padding-top:28px;border-top:1px solid #444}.original a{display:inline-block;border-radius:999px;background:#f6f6f3;color:#000;padding:15px 25px;font-size:14px}.original a:hover{background:#d2ff39}.next{max-width:1080px;margin:110px auto 0;padding-top:20px;border-top:1px solid #444;display:flex;justify-content:space-between;gap:30px;font-size:13px;color:#aaa}.next a:hover{color:#fff}.error{max-width:800px;margin:80px auto;color:#ccc;font-size:20px}.error a{text-decoration:underline}@media(max-width:850px){main{padding:125px 20px 100px}.back{margin-bottom:46px}.article h1{font-size:clamp(46px,10vw,75px)}.article-meta{margin-bottom:38px}.article-intro{margin:45px auto}.article-body figure{margin:45px 0}.next{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style><link rel="stylesheet" href="shared.css"></head><body data-page="article"><header class="site-header" id="site-header"></header><main><a class="back" href="stories.html">← All Stories</a><div id="article" class="article" aria-live="polite"></div><nav id="next" class="next" aria-label="More stories"></nav></main><footer class="site-footer" id="site-footer"></footer><script src="shared.js"></script><script>
const slug=new URLSearchParams(location.search).get('slug'),article=document.getElementById('article');
function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
function render(story,all){document.title=story.title+' | UAAD';const meta=document.querySelector('meta[name="description"]');meta.content=story.excerpt||story.title;article.replaceChildren();const eyebrow=node('div','article-eyebrow');(story.tags||[]).forEach(tag=>eyebrow.append(node('span','',tag)));article.append(eyebrow,node('h1','',story.title));const info=node('div','article-meta');[story.author||'UAAD',story.date,story.read].filter(Boolean).forEach((piece,i)=>{if(i)info.append(node('span','','·'));info.append(node('span','',piece))});article.append(info);if(story.image){const img=node('img','article-cover');img.src=story.image;img.alt=story.imageAlt||story.title;img.onerror=()=>img.hidden=true;article.append(img)}if(story.excerpt)article.append(node('p','article-intro',story.excerpt));const body=node('div','article-body');(story.body||[]).forEach(part=>{if(part.type==='heading')body.append(node('h2','',part.text));else if(part.type==='paragraph')body.append(node('p','',part.text));else if(part.type==='quote')body.append(node('blockquote','',part.text));else if(part.type==='image'&&part.src){const figure=node('figure'),image=node('img');image.src=part.src;image.alt=part.alt||'';image.loading='lazy';figure.append(image);if(part.caption)figure.append(node('figcaption','',part.caption));body.append(figure)}});article.append(body);if(story.url){const original=node('div','original'),a=node('a','','Read the complete story on UAAD ↗');a.href=story.url;a.target='_blank';a.rel='noopener noreferrer';original.append(a);article.append(original)}const next=document.getElementById('next');next.replaceChildren();let index=all.findIndex(x=>x.slug===story.slug);if(index>0){let a=node('a','','← Previous story');a.href='story.html?slug='+encodeURIComponent(all[index-1].slug);next.append(a)}if(index<all.length-1){let a=node('a','','Next story →');a.href='story.html?slug='+encodeURIComponent(all[index+1].slug);next.append(a)}}
fetch('stories.json').then(r=>{if(!r.ok)throw Error('Cannot load stories.json');return r.json()}).then(all=>{const story=all.find(s=>s.slug===slug);if(!story)throw Error('Story not found');render(story,all)}).catch(()=>{article.innerHTML='<div class="error">Story unavailable. <a href="stories.html">Return to all stories</a>.</div>'});
</script></body></html>
