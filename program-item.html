<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Program | Underground Art And Design</title><meta name="description" content="A program from Underground Art And Design."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#f6f6f3;--muted:#999;--line:#373737}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#000;color:var(--ink);font-family:"Wix Madefor Display",Arial,sans-serif}a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid #d2ff39;outline-offset:4px}::selection{background:#d2ff39;color:#000}main{padding:155px 4vw 145px}.back{color:#aaa;font-size:13px;display:inline-block;margin-bottom:70px}.back:hover{color:#fff}.category{font-size:12px;color:#aaa;text-transform:uppercase;letter-spacing:.13em}.heading h1{font-size:clamp(62px,9vw,150px);line-height:.91;letter-spacing:-.085em;font-weight:500;max-width:1500px;margin:23px 0 75px}.meta{border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:30px;padding:23px 0;margin-bottom:80px}.meta dt{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#8d8d8d;margin-bottom:12px}.meta dd{font-size:clamp(17px,1.65vw,25px);line-height:1.22;letter-spacing:-.035em;margin:0}.intro{display:grid;grid-template-columns:1fr 3fr;gap:50px;margin:0 0 145px}.label{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:#999}.intro p{font-size:clamp(25px,3.1vw,48px);line-height:1.19;letter-spacing:-.045em;max-width:1170px;margin:0}.artists,.gallery{border-top:1px solid var(--line);padding-top:28px;margin-bottom:130px}.section-head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:60px}.section-head h2{font-size:clamp(55px,8vw,115px);font-weight:500;line-height:.95;letter-spacing:-.075em;margin:0}.section-head span{font-size:11px;color:#999;letter-spacing:.1em;text-transform:uppercase}.artist-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:60px 22px}.artist-card{min-width:0}.portrait{width:100%;aspect-ratio:4/5;background:#1c1c1c;display:grid;place-items:center;overflow:hidden}.portrait img{width:100%;height:100%;object-fit:cover}.portrait-fallback{color:#777;font-size:clamp(40px,7vw,100px);letter-spacing:-.08em;text-transform:uppercase}.artist-name{font-size:clamp(20px,2vw,31px);line-height:1.13;letter-spacing:-.05em;margin:16px 0 4px}.artist-piece{font-size:13px;line-height:1.35;color:#aaa}.gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px}.gallery-grid figure{margin:0}.gallery-grid figure:first-child:nth-last-child(odd){grid-column:1/-1}.gallery-grid img{width:100%;height:auto;max-height:780px;object-fit:contain;display:block;background:#141414}.gallery-grid figcaption{font-size:12px;color:#999;margin-top:12px}.event-link{padding:70px 0 85px;display:flex;justify-content:flex-start;align-items:center}.event-link h2{font-size:clamp(35px,5vw,75px);font-weight:500;letter-spacing:-.065em;line-height:1.03;margin:0}.event-link a{border-radius:999px;background:#f3f3ef;color:#111;padding:17px 25px;font-size:14px;white-space:nowrap}.event-link a:hover{background:#d2ff39}.more{padding-top:25px;display:flex;justify-content:space-between;gap:35px;color:#aaa;font-size:13px}.more a:hover{color:#fff}.empty{max-width:800px;margin:80px auto;font-size:24px;color:#bbb}.empty a{text-decoration:underline}@media(max-width:900px){.artist-grid{grid-template-columns:repeat(3,1fr)}.intro{grid-template-columns:1fr;gap:25px}}@media(max-width:650px){main{padding:125px 20px 90px}.back{margin-bottom:50px}.heading h1{font-size:clamp(50px,11vw,78px);margin-bottom:50px}.meta{grid-template-columns:1fr 1fr;gap:25px}.intro{margin-bottom:100px}.intro p{font-size:clamp(24px,6vw,32px)}.artists,.gallery{margin-bottom:100px}.section-head{margin-bottom:38px}.section-head h2{font-size:clamp(50px,11vw,75px)}.artist-grid{grid-template-columns:repeat(2,1fr);gap:35px 12px}.artist-name{font-size:21px}.gallery-grid{grid-template-columns:1fr;gap:30px}.gallery-grid figure:first-child:nth-last-child(odd){grid-column:auto}.event-link{flex-direction:column;align-items:start;gap:25px}.more{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style><link rel="stylesheet" href="shared.css"></head><body data-page="program-item"><header class="site-header" id="site-header"></header><main><a class="back" href="program.html">← All Programs</a><article id="project" aria-live="polite"></article><nav class="more" id="more" aria-label="More programs"></nav></main><footer class="site-footer" id="site-footer"></footer><script src="shared.js"></script><script>
const slug=new URLSearchParams(location.search).get('slug'),project=document.getElementById('project');function el(tag,cls,value){let x=document.createElement(tag);if(cls)x.className=cls;if(value!==undefined)x.textContent=value;return x}
function render(p,all){document.title=p.title+' | UAAD';document.querySelector('meta[name="description"]').content=p.description||p.introduction||p.title;project.replaceChildren();const header=el('header','heading');header.append(el('div','category',p.section+' / '+p.year),el('h1','',p.title));project.append(header);const meta=el('dl','meta');[['Date',p.date],['Year',p.year],['Venue',p.venue]].forEach(([k,v])=>{let box=el('div');box.append(el('dt','',k),el('dd','',v||'—'));meta.append(box)});project.append(meta);const intro=el('section','intro');intro.append(el('div','label','Introduction'),el('p','',p.introduction||p.description||'Information about this program is coming soon.'));project.append(intro);
if(Array.isArray(p.artists)&&p.artists.length){const section=el('section','artists'),head=el('div','section-head'),grid=el('div','artist-grid');head.append(el('h2','','Artists'),el('span','',p.artists.length+' participants'));section.append(head);p.artists.forEach(person=>{let card=el('div','artist-card'),portrait=el('div','portrait');if(person.headshot){let img=el('img');img.src=person.headshot;img.alt='Portrait of '+person.name;img.loading='lazy';img.onerror=()=>{img.remove();portrait.append(el('span','portrait-fallback',person.name.trim().charAt(0))) };portrait.append(img)}else portrait.append(el('span','portrait-fallback',person.name.trim().charAt(0)));card.append(portrait,el('div','artist-name',person.name));if(person.piece)card.append(el('div','artist-piece',person.piece));grid.append(card)});section.append(grid);project.append(section)}
if(Array.isArray(p.images)&&p.images.length){const section=el('section','gallery'),head=el('div','section-head'),grid=el('div','gallery-grid');head.append(el('h2','','Gallery'),el('span','',p.images.length+' '+(p.images.length===1?'image':'images')));section.append(head);p.images.forEach(entry=>{const figure=el('figure'),img=el('img');img.src=entry.src;img.alt=entry.alt||p.title;img.loading='lazy';img.onerror=()=>figure.remove();figure.append(img);if(entry.caption)figure.append(el('figcaption','',entry.caption));grid.append(figure)});section.append(grid);project.append(section)}
if(p.url){const box=el('section','event-link'),a=el('a','','Link to the event page ↗');a.href=p.url;a.target='_blank';a.rel='noopener noreferrer';box.append(a);project.append(box)}const nav=document.getElementById('more'),i=all.indexOf(p);nav.replaceChildren();if(i>0){let a=el('a','','← Previous program');a.href='program-item.html?slug='+encodeURIComponent(all[i-1].slug);nav.append(a)}if(i<all.length-1){let a=el('a','','Next program →');a.href='program-item.html?slug='+encodeURIComponent(all[i+1].slug);nav.append(a)}}
fetch('programs.json').then(r=>{if(!r.ok)throw Error('Program data unavailable');return r.json()}).then(all=>{const item=all.find(p=>p.slug===slug);if(!item)throw Error('Program not found');render(item,all)}).catch(()=>{project.innerHTML='<div class="empty">Program unavailable. <a href="program.html">Return to the archive</a>.</div>'});
</script></body></html>
